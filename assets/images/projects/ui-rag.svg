 >Quelle est la procédure à suivre</text><text x="668" y="220" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" font-weight="500" text-anchor="start" >en cas d'alarme critique ?</text><rect x="326" y="270" width="690" height="300" rx="20" fill="#ffffff" stroke="#e6def4" stroke-width="1" /><circle cx="364" cy="306" r="18" fill="#7a3b8f"/><text x="364" y="312" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle" >IA</text><text x="398" y="340" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2a1a45" font-weight="500" text-anchor="start" >1. Vérifier l'état de l'équipement et isoler la zone concernée.</text><text x="398" y="380" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2a1a45" font-weight="500" text-anchor="start" >2. Notifier le responsable d'exploitation via le canal d'astreinte.</text><text x="398" y="420" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#2a1a45" font-weight="500" text-anchor="start" >3. Consigner l'incident puis suivre la checklist de remise en service.</text><rect x="354" y="470" width="330" height="40" rx="20" fill="#f1ebfa" stroke="#d9cff0" stroke-width="1" /><text x="374" y="496" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5b2a6b" font-weight="600" text-anchor="start" >[1] procedure_exploitation.pdf · p. 12</text><rect x="699" y="470" width="330" height="40" rx="20" fill="#f1ebfa" stroke="#d9cff0" stroke-width="1" /><text x="719" y="496" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5b2a6b" font-weight="600" text-anchor="start" >[2] specification_technique.pdf · p. 4</text><rect x="354" y="524" width="200" height="30" rx="15" fill="#fff3f8" stroke="none" stroke-width="1" /><text x="372" y="545" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c04a8a" font-weight="700" text-anchor="start" >Pertinence · recall 82 %</text><rect x="326" y="700" width="780" height=