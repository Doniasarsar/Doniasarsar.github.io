<rect x="104" y="308" width="70" height="34" rx="8" fill="#ff4b4b" stroke="none" stroke-width="1"/><text x="139.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">CTO</text><rect x="184" y="308" width="100" height="34" rx="8" fill="#ff4b4b" stroke="none" stroke-width="1"/><text x="234.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Tech Lead</text><rect x="24" y="352" width="90" height="34" rx="8" fill="#ff4b4b" stroke="none" stroke-width="1"/><text x="69.0" y="374" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">DevOps</text><text x="24" y="446" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" font-weight="600" text-anchor="start">Modèle</text><rect x="24" y="462" width="252" height="44" rx="10" fill="#fff" stroke="#e6e9ef" stroke-width="2"/><text x="40" y="490" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#262730" font-weight="500" text-anchor="start">Ollama · llama3</text><path d="M248 480 l8 9 l8 -9" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="526" width="252" height="38" rx="10" fill="#fff" stroke="#e6e9ef" stroke-width="2"/><text x="40" y="551" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="500" text-anchor="start">Mode local · données privées</text><rect x="24" y="720" width="252" height="46" rx="10" fill="#ff4b4b" stroke="none" stroke-width="1"/><text x="150" y="749" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">Lancer le débat</text><text x="340" y="112" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#262730" font-weight="700" text-anchor="start">Conseil des Sages</text><text x="340" y="140" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">Les experts débattent, puis le président synthétise un plan d'action.</text><rect x="640" y="164" width="520" height="54" rx="14" fill="#f0f2f6" stroke="none" stroke-width="1"/><text x="664" y="198" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#262730" font-weight="500" text-anchor="start">Quelle architecture pour lancer notre MVP ?</text><rect x="340" y="242" width="820" height="88" rx="14" fill="#fff" stroke="#e6e9ef" stroke-width="2"/><circle cx="378" cy="286" r="20" fill="#ff4b4b"/><text x="378" y="292" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="416" y="276" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#262730" font-weight="700" text-anchor="start">CEO</text><text x="416" y="300" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444" font-weight="400" text-anchor="start">Priorité : valider le marché rapidement.</text><text x="416" y="320" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444" font-weight="400" text-anchor="start">Un périmètre réduit, des retours clients dès le mois 1.</text><rect x="340" y="342" width="820" height="88" rx="14" fill="#fff" stroke="#e6e9ef" stroke-width="2"/><circle cx="378" cy="386" r="20" fill="#3f6fd1"/><text x="378" y="392" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">C</text><text x="416" y="376" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#262730" font-weight="700" text-anchor="start">CTO</text><text x="416" y="400" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444" font-weight="400" text-anchor="start">Architecture simple et modulaire, évolutive.</text><text x="416" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444" font-weight="400" text-anchor="start">Un monolithe propre vaut mieux que des microservices trop tôt.</text><rect x="340" y="442" width="820" height="88" rx="14" fill="#fff" stroke="#e6e9ef" stroke-width="2"/><circle cx="378" cy="486" r="20" fill="#10b981"/><text x="378" y="492" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700" text-anchor="middle">T</text><text x="416" y="476" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#262730" font-weight="700" text-anchor="start">Tech Lead</text><text x="416" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444" font-weight="400" text-anchor="start">Je rejoins le CTO sur la modularité.</text><text x="416" y="520" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#444" font-weight="400" text-anchor="start">Tests et CI dès le départ pour garder le rythme.</text><rect x="340" y="548" width="820" height="176" rx="14" fill="#fff5f5" stroke="#ffd0d0" stroke-width="2"/><rect x="340" y="548" width="8" height="176" rx="4" fill="#ff4b4b" stroke="none" stroke-width="1"/><text x="372" y="584" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#262730" font-weight="700" text-anchor="start">Synthèse du Président · Plan d'action</text><circle cx="378" cy="616" r="5" fill="#ff4b4b"/><text x="396" y="622" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#262730" font-weight="500" text-anchor="start">1. Valider le besoin avec un premier périmètre réduit</text><circle cx="378" cy="652" r="5" fill="#ff4b4b"/><text x="396" y="658" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#262730" font-weight="500" text-anchor="start">2. Construire une architecture modulaire et testée</text><circle cx="378" cy="688" r="5" fill="#ff4b4b"/><text x="396" y="694" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#262730" font-weight="500" text-anchor="start">3. Industrialiser (CI/CD) une fois le MVP validé</text><rect x="340" y="742" width="820" height="44" rx="22" fill="#fff" stroke="#e6e9ef" stroke-width="2"/><text x="366" y="770" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9aa0ab" font-weight="400" text-anchor="start">Posez votre question au conseil…</text><circle cx="1130" cy="764" r="16" fill="#ff4b4b"/><path d="M1123 764 h14 m-6 -6 l6 6 l-6 6" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>